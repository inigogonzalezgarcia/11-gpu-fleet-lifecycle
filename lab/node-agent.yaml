# Lab only: the per-node agent that "installs" driver versions. hostNetwork so the controller and the
# validation Job reach it on the node IP; its own namespace because baseline Pod Security forbids it.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-node-agent
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: gpu-node-agent
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-agent}
    spec:
      hostNetwork: true
      nodeSelector: {nvidia.com/gpu.present: "true"}
      tolerations: [{operator: Exists}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: IMAGE
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/node-agent
            - -listen=:9500
            - -version=r570-lab
            - -install-delay=4s
            - -bad-versions=r580-lab-bad    # fails validation
            - -xid-versions=r580-lab-xid    # validates, then XID 79 under load
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            httpGet: {path: /healthz, port: 9500}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
